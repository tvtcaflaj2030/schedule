<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام جدول المتدرب - معهد الأفلاج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f4f8; color: #2d3748; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; border-radius: 20px; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.05); width: 100%; max-width: 500px; padding: 35px 25px 20px; position: relative; text-align: center; }
        .calendar-icon { font-size: 38px; color: #00877d; margin-bottom: 10px; }
        h1 { font-size: 21px; color: #0f2d59; font-weight: 800; margin-bottom: 6px; }
        p.subtitle { color: #718096; font-size: 13.5px; margin-bottom: 22px; }
        .form-group { display: flex; flex-direction: row-reverse; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14.5px; text-align: center; outline: none; }
        input[type="text"]:focus { border-color: #00877d; }
        button { padding: 12px 24px; background-color: #00877d; color: white; border: none; border-radius: 10px; font-size: 14.5px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #006e66; }
        .loader { display: none; margin: 15px auto; border: 3px solid #f3f3f3; border-top: 3px solid #00877d; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .alert { display: none; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; }
        .alert-error { background-color: #fed7d7; color: #9b2c2c; }
        .image-wrapper { border: 1.5px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fafafa; margin-top: 15px; margin-bottom: 15px; max-height: 480px; overflow-y: auto; }
        .image-wrapper img { width: 100%; height: auto; display: block; }
        .btn-download { display: inline-block; padding: 10px 20px; background-color: #00877d; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 13.5px; margin-bottom: 10px; }
        .back-link { display: inline-block; margin-top: 20px; color: #718096; text-decoration: none; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-icon"><i class="fa-solid fa-calendar-check"></i></div>
    <h1>استعلام الجدول التدريبي</h1>
    <p class="subtitle">معهد التدريب الوطني بالأفلاج</p>

    <form id="search-form">
        <div class="form-group">
            <button type="submit" id="submit-btn">بحث</button>
            <input type="text" id="trainee_id" placeholder="أدخل الرقم التدريبي" required autocomplete="off">
        </div>
    </form>

    <div class="loader" id="loader"></div>
    <div class="alert alert-error" id="error-box"></div>

    <div id="result-box" style="display:none;">
        <div class="image-wrapper">
            <img id="schedule-img" src="" alt="جدول المتدرب">
        </div>
        <a href="" id="download-link" download="جدول_المتدرب.png" class="btn-download">📥 حفظ الجدول كصورة</a>
    </div>

    <br>
    <a href="/" class="back-link">⬅️ العودة للرئيسية</a>
</div>

<script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('trainee_id');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error-box');
    const resultBox = document.getElementById('result-box');
    const scheduleImg = document.getElementById('schedule-img');
    const downloadLink = document.getElementById('download-link');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const traineeId = input.value.trim();
        if (!traineeId) return;

        errorBox.style.display = 'none';
        resultBox.style.display = 'none';
        loader.style.display = 'block';

        try {
            const formData = new FormData();
            formData.append('trainee_id', traineeId);
            const response = await fetch('/search_schedule', { method: 'POST', body: formData });
            const data = await response.json();

            loader.style.display = 'none';
            if (data.success) {
                const imgUrl = `/get_schedule_image?pages=${data.pages}&t=${new Date().getTime()}`;
                scheduleImg.src = imgUrl;
                downloadLink.href = imgUrl;
                resultBox.style.display = 'block';
            } else {
                errorBox.innerText = data.message;
                errorBox.style.display = 'block';
            }
        } catch (err) {
            loader.style.display = 'none';
            errorBox.innerText = 'تعذر الاتصال بالخادم.';
            errorBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
