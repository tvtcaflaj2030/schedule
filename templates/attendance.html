<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام نسب الغياب - معهد الأفلاج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 30px 15px; display: flex; justify-content: center; align-items: center; }
        .card { background: #ffffff; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06); width: 100%; max-width: 550px; padding: 50px 30px; text-align: center; }
        
        .icon-box {
            font-size: 55px;
            color: #e53e3e;
            margin-bottom: 25px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .alert-message {
            font-size: 26px;
            font-weight: 900;
            color: #c53030;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .sub-text {
            color: #718096;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background-color: #00877d;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.25s ease;
        }

        .back-btn:hover {
            background-color: #006e66;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">
        <i class="fa-solid fa-screwdriver-wrench"></i>
    </div>
    
    <div class="alert-message">
        جاري العمل على تطوير هذه الصفحة قريباً
    </div>

    <p class="sub-text">سيتم إتاحة خدمة استعلام نسب الغياب والمقررات فور اكتمال التحديثات الفنية.</p>

    <a href="/" class="back-btn">
        <i class="fa-solid fa-arrow-right"></i>
        <span>العودة للصفحة الرئيسية</span>
    </a>
</div>

</body>
</html>
