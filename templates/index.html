<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام جدول وغيابات المتدرب</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f4f8; color: #2d3748; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; border-radius: 20px; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.05); width: 100%; max-width: 580px; padding: 35px 25px 20px; position: relative; text-align: center; }
        .calendar-icon { font-size: 40px; margin-bottom: 10px; }
        h1 { font-size: 22px; color: #0f2d59; font-weight: 800; margin-bottom: 6px; }
        p.subtitle { color: #718096; font-size: 13.5px; margin-bottom: 22px; }
        .form-group { display: flex; flex-direction: row-reverse; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14.5px; text-align: center; outline: none; }
        input[type="text"]:focus { border-color: #00877d; box-shadow: 0 0 0 3px rgba(0, 135, 125, 0.12); }
        button { padding: 12px 24px; background-color: #00877d; color: white; border: none; border-radius: 10px; font-size: 14.5px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #006e66; }
        .alert { display: none; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; }
        .alert-error { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
        .loader { display: none; margin: 15px auto; border: 3px solid #f3f3f3; border-top: 3px solid #00877d; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* نتائج الغياب */
        .section-box { margin-top: 20px; text-align: right; }
        .section-title { font-size: 15px; font-weight: bold; color: #0f2d59; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #edf2f7; padding-bottom: 6px; }
        .course-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
        .course-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
        .progress-bar-bg { background: #e2e8f0; border-radius: 6px; height: 8px; width: 100%; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 6px; }

        /* ألوان الحالات */
        .status-safe { color: #22543d; }
        .fill-safe { background-color: #38a169; }
        .status-warn1 { color: #b7791f; }
        .fill-warn1 { background-color: #d69e2e; }
        .status-warn2 { color: #dd6b20; }
        .fill-warn2 { background-color: #ed8936; }
        .status-danger { color: #e53e3e; }
        .fill-danger { background-color: #e53e3e; }

        /* الجدول */
        .image-wrapper { border: 1.5px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fafafa; margin-top: 10px; margin-bottom: 12px; max-height: 480px; overflow-y: auto; }
        .image-wrapper img { width: 100%; height: auto; display: block; }
        .btn-download { display: inline-block; padding: 10px 20px; background-color: #00877d; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 13px; margin-bottom: 15px; }
        .card-footer-notes { margin-top: 25px; padding-top: 12px; border-top: 1px dashed #e2e8f0; display: flex; flex-direction: column; gap: 3px; }
        .footer-note-main { font-size: 12px; color: #718096; font-weight: 600; }
        .footer-note-sub { font-size: 11px; color: #e53e3e; font-weight: 700; }
        .dev-credits { position: absolute; bottom: 8px; left: 14px; font-size: 8.5px; color: #a0aec0; font-family: Arial, sans-serif; font-weight: 600; direction: ltr; }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-icon">📊</div>
    <h1>استعلام الجدول والغياب</h1>
    <p class="subtitle">أدخل الرقم التدريبي للاستعلام عن جدولك ونسب غيابك</p>

    <form id="search-form">
        <div class="form-group">
            <button type="submit" id="submit-btn">بحث</button>
            <input type="text" id="trainee_id" placeholder="أدخل الرقم التدريبي" required autocomplete="off">
        </div>
    </form>

    <div class="loader" id="loader"></div>
    <div class="alert alert-error" id="error-box"></div>

    <!-- تقرير الغياب -->
    <div id="attendance-section" class="section-box" style="display:none;">
        <div class="section-title">
            <span>📑 نسبة الغياب بالمقررات</span>
            <span id="student-name-tag" style="font-size: 12px; color: #00877d;"></span>
        </div>
        <div id="courses-container"></div>
    </div>

    <!-- الجدول الدراسي -->
    <div id="schedule-section" class="section-box" style="display:none; text-align: center;">
        <div class="section-title"><span>🗓️ الجدول التدريبي الأسبوعي</span></div>
        <div class="image-wrapper">
            <img id="schedule-img" src="" alt="جدول المتدرب">
        </div>
        <a href="" id="download-link" download="جدول_المتدرب.png" class="btn-download">📥 تحميل صورة الجدول</a>
    </div>

    <div class="card-footer-notes">
        <span class="footer-note-main">هذا النموذج خاص بمتدربي معهد الأفلاج</span>
        <span class="footer-note-sub">نسخة أولية</span>
    </div>
    <div class="dev-credits">Powered by ENG.TURKI</div>
</div>

<script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('trainee_id');
    const submitBtn = document.getElementById('submit-btn');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error-box');
    const attendanceSection = document.getElementById('attendance-section');
    const coursesContainer = document.getElementById('courses-container');
    const studentNameTag = document.getElementById('student-name-tag');
    const scheduleSection = document.getElementById('schedule-section');
    const scheduleImg = document.getElementById('schedule-img');
    const downloadLink = document.getElementById('download-link');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const traineeId = input.value.trim();
        if (!traineeId) return;

        errorBox.style.display = 'none';
        attendanceSection.style.display = 'none';
        scheduleSection.style.display = 'none';
        coursesContainer.innerHTML = '';
        loader.style.display = 'block';
        submitBtn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('trainee_id', traineeId);

            const response = await fetch('/search', { method: 'POST', body: formData });
            const data = await response.json();
            loader.style.display = 'none';
            submitBtn.disabled = false;

            if (data.success) {
                // عرض بطاقات الغياب
                if (data.attendance && data.attendance.courses.length > 0) {
                    studentNameTag.innerText = data.attendance.student_name || '';
                    data.attendance.courses.forEach(c => {
                        let fillClass = 'fill-safe', statusClass = 'status-safe';
                        if (c.percentage >= 20.0 || c.status === 'حرمان') {
                            fillClass = 'fill-danger'; statusClass = 'status-danger';
                        } else if (c.percentage >= 15.0) {
                            fillClass = 'fill-warn2'; statusClass = 'status-warn2';
                        } else if (c.percentage >= 10.0) {
                            fillClass = 'fill-warn1'; statusClass = 'status-warn1';
                        }

                        const card = `
                            <div class="course-card">
                                <div class="course-header">
                                    <span>${c.course_name}</span>
                                    <span class="${statusClass}">${c.status} (${c.percentage}%)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill ${fillClass}" style="width: ${Math.min(c.percentage * 5, 100)}%;"></div>
                                </div>
                            </div>
                        `;
                        coursesContainer.insertAdjacentHTML('beforeend', card);
                    });
                    attendanceSection.style.display = 'block';
                }

                // عرض الجدول
                if (data.has_schedule) {
                    const imgUrl = `/get_schedule_image?pages=${data.schedule_pages}&t=${new Date().getTime()}`;
                    scheduleImg.src = imgUrl;
                    downloadLink.href = imgUrl;
                    scheduleSection.style.display = 'block';
                }
            } else {
                errorBox.innerText = data.message;
                errorBox.style.display = 'block';
            }
        } catch (err) {
            loader.style.display = 'none';
            submitBtn.disabled = false;
            errorBox.innerText = 'تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً.';
            errorBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
