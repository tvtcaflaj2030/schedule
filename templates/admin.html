<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - معهد الأفلاج</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f4f8; color: #2d3748; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.05); width: 100%; max-width: 480px; padding: 35px 30px; text-align: center; }
        h2 { font-size: 20px; color: #0f2d59; margin-bottom: 20px; }
        input[type="password"], input[type="file"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #00877d; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #006e66; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13.5px; }
        .msg-error { background: #fed7d7; color: #9b2c2c; }
        .msg-success { background: #c6f6d5; color: #22543d; }
        .logout-link { display: inline-block; margin-top: 15px; font-size: 13px; color: #e53e3e; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ لوحة إدارة الجداول</h2>

    {% if msg %}
        <div class="msg msg-{{ msg_type }}">{{ msg }}</div>
    {% endif %}

    {% if not logged_in %}
        <form method="POST">
            <input type="hidden" name="action" value="login">
            <input type="password" name="password" placeholder="أدخل كلمة مرور المسؤول" required>
            <button type="submit">دخول</button>
        </form>
    {% else %}
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="action" value="upload">
            <label style="display:block; margin-bottom: 8px; font-size: 13px; color: #718096;">اختر ملف PDF الجديد للجداول:</label>
            <input type="file" name="pdf_file" accept=".pdf" required>
            <button type="submit">رفع وتحديث الجدول</button>
        </form>
        <a href="/admin/logout" class="logout-link">تسجيل الخروج</a>
    {% endif %}
</div>

</body>
</html>
